services:
  db:
    image: postgres:16-alpine
    container_name: passkey-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: passkey
      POSTGRES_PASSWORD: passkey
      POSTGRES_DB: passkey_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passkey -d passkey_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
